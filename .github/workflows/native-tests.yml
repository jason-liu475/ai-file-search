name: Native Platform Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Rust Toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
      - name: Check Formatting
        run: cargo +1.96.0 fmt --all -- --check
      - name: Strict Clippy
        run: cargo +1.96.0 clippy --workspace --all-targets --locked -- -D warnings
      - name: Workspace Tests
        run: cargo +1.96.0 test --workspace --locked
